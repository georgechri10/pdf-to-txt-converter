<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SharpOdds</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#000;color:#eee}
#log{padding:10px;font-size:16px;line-height:1.5}
.u{color:#16c784}.b{color:#eee}.d{color:#888}
form{position:sticky;bottom:0;display:flex;background:#000;padding:8px;border-top:1px solid #222}
input{flex:1;padding:12px;font-size:16px;background:#111;color:#eee;border:1px solid #333;border-radius:6px}
button{margin-left:6px;padding:0 16px;font-size:16px;background:#16c784;border:0;border-radius:6px;color:#000;font-weight:700}
</style>
</head>
<body>
<div id="log"><div class="d">Ask the odds of one event — e.g. "England vs Mexico 1"</div></div>
<form id="f">
<input id="i" autocomplete="off" autofocus placeholder='England vs Mexico 1'>
<button>Go</button>
</form>
<script>
const log=document.getElementById('log'),f=document.getElementById('f'),i=document.getElementById('i');
function add(t,c){const d=document.createElement('div');d.className=c;d.textContent=t;log.appendChild(d);scrollTo(0,document.body.scrollHeight);return d}
f.onsubmit=async e=>{
  e.preventDefault();
  const m=i.value.trim();if(!m)return;
  add('› '+m,'u');i.value='';
  const p=add('…','d');
  try{
    const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
    const j=await r.json();p.className='b';p.textContent=j.answer||j.error||'No market found.';
  }catch{p.className='b';p.textContent='Error, try again.'}
  i.focus();
};
</script>
</body>
</html>
